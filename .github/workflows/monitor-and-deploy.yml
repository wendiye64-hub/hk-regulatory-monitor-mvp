name: Monitor Hong Kong regulations and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  monitor-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Check official sources and update dashboard data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          SYNC_DIST: 'false'
        run: node scripts/monitor.mjs
      - name: Save newly detected releases
        run: |
          git config user.name "regwatch-monitor[bot]"
          git config user.email "regwatch-monitor[bot]@users.noreply.github.com"
          git add public/data/latest-run.json
          git diff --cached --quiet || git commit -m "Update Hong Kong regulatory feed"
          git pull --rebase origin main
          git push
      - name: Build Vue frontend
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
