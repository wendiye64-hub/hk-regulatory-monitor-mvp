<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · RegWatch HK</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="login-screen">
    <div class="login-card">
      <div class="login-mark">R</div>
      <p class="eyebrow">REGWATCH HK</p>
      <h1>Sign in to Regulatory Radar</h1>
      <p>Access the latest verified Hong Kong regulatory updates.</p>
      <form id="login-form">
        <label for="access-email">Work email</label>
        <input id="access-email" type="email" autocomplete="email" placeholder="name@company.com" required>
        <label for="access-password">Access password</label>
        <input id="access-password" type="password" autocomplete="current-password" placeholder="Enter password" required>
        <button type="submit">Continue <span>→</span></button>
        <small id="login-error" aria-live="polite"></small>
      </form>
      <div class="login-note">Demo access only · Not a production security control</div>
    </div>
  </section>
  <script src="login.js"></script>
</body>
</html>
